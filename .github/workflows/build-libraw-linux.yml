# Rebuilds linux/native/libraw_r.so against an old glibc, on demand.
#
# The committed one was built in WSL on Ubuntu 26.04 and needs GLIBC_2.43,
# so it will not load on Ubuntu 24.04 LTS or Debian stable — which is most
# of the machines anyone would actually run this on. CI found that; see
# tool/native_smoke_test.dart.
#
# Everything else in the Linux bundle already tops out at GLIBC_2.34 (the
# app binary itself; the Flutter engine needs 2.18 and ONNX Runtime 2.27),
# so LibRaw is the only thing raising the floor. Building it on Debian
# bullseye (glibc 2.31) puts it below that, making the app binary the
# limit again.
#
# Manual, not on push: the result is a committed binary. Run this, download
# the artifact, replace linux/native/libraw_r.so, commit.
name: Build libraw_r.so (Linux, old glibc)

on:
  workflow_dispatch:
    inputs:
      libraw_version:
        description: LibRaw version tag to build
        default: "0.22.0"

jobs:
  build:
    runs-on: ubuntu-latest
    # glibc 2.31 — comfortably under the 2.34 the rest of the bundle needs.
    container: debian:bullseye
    steps:
      - name: Install the build toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates build-essential autoconf automake libtool \
            pkg-config libjpeg-dev zlib1g-dev liblcms2-dev binutils
          ldd --version | head -1

      - name: Build LibRaw ${{ inputs.libraw_version }}
        run: |
          git clone --depth 1 --branch ${{ inputs.libraw_version }} \
            https://github.com/LibRaw/LibRaw.git /tmp/LibRaw
          cd /tmp/LibRaw
          autoreconf -fiv
          # g++, not clang++: clang needs a separate libomp-dev for omp.h
          # that gcc bundles on its own — same note as linux/native/README.
          CC=gcc CXX=g++ ./configure --disable-examples
          make -j"$(nproc)"
          cp lib/.libs/libraw_r.so.*.*.* /tmp/libraw_r.so
          # Keep the SONAME the loader asks for; DynamicLibrary.open uses
          # the bare filename.
          patchelf --version >/dev/null 2>&1 || true

      - name: Report what it needs
        run: |
          cd /tmp
          echo "SONAME: $(objdump -p libraw_r.so | awk '/SONAME/{print $2}')"
          echo "highest GLIBC symbol: $(objdump -T libraw_r.so \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -u -t. -k1,1V -k2,2V | tail -1)"
          echo "links against:"
          objdump -p libraw_r.so | awk '/NEEDED/{print "  " $2}'

      - name: Fail if it still needs a new glibc
        run: |
          cd /tmp
          max=$(objdump -T libraw_r.so | grep -oE 'GLIBC_[0-9]+\.[0-9]+' \
            | sort -u -t. -k1,1V -k2,2V | tail -1)
          # 2.34 is the floor the rest of the bundle already sets, so
          # anything at or under it means LibRaw is no longer the limit.
          case "$max" in
            GLIBC_2.3|GLIBC_2.[0-9]|GLIBC_2.1[0-9]|GLIBC_2.2[0-9]|GLIBC_2.3[0-4])
              echo "OK: $max" ;;
            *)
              echo "still too new: $max"; exit 1 ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: libraw_r-linux-x64
          path: /tmp/libraw_r.so
          if-no-files-found: error
