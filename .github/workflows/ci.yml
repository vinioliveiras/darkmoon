# Build and test darkmoon on all three desktop platforms.
#
# macOS is here for a specific reason: it is the one platform the project
# has no hardware for. The runners are real Apple machines and are free for
# a public repo, so this is how a macOS build gets exercised at all.
#
# What this does NOT produce is a *distributable* build. The ONNX model
# weights (~1.2GB) are gitignored — over GitHub's per-file limit — so
# nothing here bundles them, and the AI features would report a missing
# model at runtime. Releases are still cut locally, where the weights are.
# The point of this workflow is "does it still compile and pass its tests
# everywhere", which is exactly what nothing was checking before.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to what the project is developed against — `flutter --version`
  # on the maintainer's machine. Floating on `stable` would turn an
  # upstream release into a surprise CI failure unrelated to any change
  # here.
  FLUTTER_VERSION: 3.35.5

defaults:
  run:
    working-directory: flutter_app

jobs:
  analyze-and-test:
    name: Analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test
      - run: flutter analyze
      - run: flutter test

  build:
    name: Build ${{ matrix.name }}
    needs: analyze-and-test
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide whether the others are fine —
      # especially while macOS support is new.
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: macos
            native_dir: macos/native
            # Just the .app, not the whole Products/Release directory —
            # that also holds intermediate frameworks and dSYMs, which
            # made the artifact 277MB against 43MB for Windows.
            artifact: build/macos/Build/Products/Release/*.app
          - name: Windows
            # Pinned, not `windows-latest`: that image moved to Server 2025,
            # where Flutter 3.35.5's Visual Studio detection picks the
            # "Visual Studio 16 2019" CMake generator and then cannot find
            # an instance of it. Same reasoning as pinning the Flutter
            # version — CI should fail because of a change here, not
            # because a hosted image rolled forward.
            os: windows-2022
            target: windows
            native_dir: windows/native
            artifact: build/windows/x64/runner/Release
          - name: Linux
            os: ubuntu-latest
            target: linux
            native_dir: linux/native
            artifact: build/linux/x64/release/bundle
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
        working-directory: .

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The macOS native libraries are not committed — this project has no
      # Mac to build them on, so they are produced here. See
      # macos/native/README.md. Cached because building LibRaw from source
      # is the slow part and its inputs only change when the script does.
      - name: Cache macOS native libraries
        if: matrix.target == 'macos'
        id: macos-natives
        uses: actions/cache@v4
        with:
          path: flutter_app/macos/native/*.dylib
          key: macos-natives-${{ hashFiles('flutter_app/tool/fetch_macos_natives.sh') }}

      - name: Fetch macOS native libraries
        if: matrix.target == 'macos' && steps.macos-natives.outputs.cache-hit != 'true'
        run: tool/fetch_macos_natives.sh

      - run: flutter config --enable-${{ matrix.target }}-desktop
      - run: flutter pub get
      - run: flutter build ${{ matrix.target }} --release

      # Not a Run Script phase inside Runner.xcodeproj yet — see the script
      # for why. Without this the .app builds but cannot open a photo.
      - name: Bundle macOS native libraries into the .app
        if: matrix.target == 'macos'
        run: tool/bundle_macos_natives.sh build/macos/Build/Products/Release/darkmoon.app

      # The real verification. macOS has no machine to try the GUI on, so
      # the native layer is exercised directly, the same way the Linux
      # build originally was. DYLD_LIBRARY_PATH points at the dylibs
      # because `dart run` is not the .app and has no rpath into it.
      # A stand-in for the real weights, which are gitignored: an identity
      # model shaped like the denoise one, so the smoke test can create a
      # session, pick an execution provider and run real inference — not
      # just prove the library opened.
      - name: Build a stand-in ONNX model
        run: |
          # --break-system-packages because the runners' Python is
          # PEP 668 externally-managed and refuses a plain install. Safe
          # here in a way it would not be on a real machine: the runner is
          # thrown away at the end of the job.
          python3 -m pip install --quiet --disable-pip-version-check             --break-system-packages onnx
          python3 tool/make_test_onnx_model.py "${{ runner.temp }}/identity.onnx"

      # The real verification. macOS has no machine to try the GUI on, so
      # the native layer is exercised directly, the same way the Linux
      # build originally was. Runs everywhere, not just macOS — a
      # regression in the Windows or Linux loaders is caught here too.
      # DYLD_LIBRARY_PATH is macOS-only and ignored elsewhere; `dart run`
      # is not the .app and has no rpath into it.
      # `dart run` is not the built app: it resolves libraries next to the
      # Dart SDK binary, not next to darkmoon. Point every loader at the
      # platform's native directory instead — GITHUB_PATH covers Windows'
      # DLL search, the two DYLD/LD variables cover the others, and
      # DARKMOON_NATIVE_DIR is the app's own override, which is also what
      # lets the WebGPU plugin be found (its path is computed relative to
      # the executable otherwise).
      - name: Put the native libraries on the search path
        shell: bash
        run: echo "${{ github.workspace }}/flutter_app/${{ matrix.native_dir }}" >> "$GITHUB_PATH"

      # Non-blocking on Linux only, for one specific known reason: the
      # committed linux/native/libraw_r.so was built on Ubuntu 26.04 and
      # needs GLIBC_2.43, which the runner (and Ubuntu 24.04 LTS, and
      # Debian stable) does not have. That is a real limitation of the
      # shipped Linux build, not of this workflow — the tarball only runs
      # on very recent distros, despite native/README.md claiming
      # otherwise. Rebuilding LibRaw against an older glibc is the fix, and
      # is its own piece of work. Everything else here still has to pass.
      - name: Native smoke test
        continue-on-error: ${{ matrix.target == 'linux' }}
        env:
          DARKMOON_NATIVE_DIR: ${{ github.workspace }}/flutter_app/${{ matrix.native_dir }}
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/flutter_app/${{ matrix.native_dir }}
          LD_LIBRARY_PATH: ${{ github.workspace }}/flutter_app/${{ matrix.native_dir }}
        run: dart run tool/native_smoke_test.dart "" "${{ runner.temp }}/identity.onnx"

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: darkmoon-${{ matrix.target }}
          path: flutter_app/${{ matrix.artifact }}
          # Without the model weights these are tens of MB, not gigabytes.
          retention-days: 14
          if-no-files-found: error
